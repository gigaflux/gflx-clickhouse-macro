name: CI Pipeline

# Trigger the workflow on pushes to the main branch and any pull requests targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Bump version while creating new release
  bump-version:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.extract-version.outputs.version }}
    steps:
      # Step 1: Generate GitHub token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Step 2: Fetch the repository source code
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Step 3: Install uv
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "latest"

      # Step 4: Bump version
      - name: Bump version to match GitHub Release Tag
        id: extract-version
        env:
          UV_PYTHON: "3.12"
        run: |
          TAG_VERSION="$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          git config --global user.name "gigaflux-release-bot[bot]"
          git config --global user.email "4612259+gigaflux-release-bot[bot]@users.noreply.github.com"
          uv run --group dev-release bumpver update --set-version "$TAG_VERSION" --no-commit --no-tag
          git add .
          git commit -m "bump: version update to $TAG_VERSION [skip ci]"
          git push origin main
          git push origin :refs/tags/${{ github.event.release.tag_name }}
          git push origin refs/tags/${{ github.event.release.tag_name }}

  # Job 2: Check for file changes
  changes:
    needs: [ bump-version ]
    if: always() && (github.event_name != 'release' || needs.bump-version.result == 'success')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      test: ${{ github.event_name == 'release' || steps.filter.outputs.test == 'true' }}
      scan: ${{ github.event_name == 'release' || steps.filter.outputs.scan == 'true' }}
    steps:
      # Step 1: Fetch the repository source code
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      # Step 2: Check for file changes
      - name: Check for file changes
        if: github.event_name != 'release'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            test:
              - 'src/**'
              - 'tests/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
            scan:
              - 'src/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'trivy.yml'
              - 'trivy-secret.yml'


  # Job 3: Run code quality tools
  lint:
    needs: [ changes ]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    # Step 1: Fetch the repository source code
    - name: Checkout code
      uses: actions/checkout@v7

    # Step 2: Install uv, since the Makefile relies on it for environment synchronization
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true # Enable automated caching of downloaded packages to speed up CI runs
        version: "latest"

    # Step 3: Execute linters, type-checkers, and spell-checkers via Ruff, Ty, Codespell and actionlint
    - name: Run Linters & Checkers
      run: make lint PYTHON_VERSION=3.12

    # Step 4: Execute Dependabot linter
    - name: Run Dependabot Linter
      uses: marocchino/validate-dependabot@d8ae5c0d03dd75fbd0ad5f8ab4ba8101ebbd4b37 # v3.0.0
      id: validate

    # Step 5: Execute Dependabot pull request comment
    - name: Run Dependabot pull request comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: always()
      with:
        header: validate-dependabot
        message: ${{ steps.validate.outputs.markdown }}

  # Job 4: Run test suites across multiple Python versions
  test:
    needs: [ lint, changes ]
    if: always() && needs.lint.result == 'success' && needs.changes.outputs.test == 'true'
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        # Test on Linux and Windows
        os: [ubuntu-latest, windows-latest]
        # Test against all Python versions defined in pyproject.toml constraints
        python-version: [ "3.10", "3.11", "3.12" ]

    runs-on: ${{ matrix.os }}

    steps:
      # Step 1: Fetch the repository source code
      - name: Checkout code
        uses: actions/checkout@v7

      # Step 2: Install uv, since the Makefile relies on it for environment synchronization
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true # Enable automated caching of downloaded packages to speed up CI runs
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}
          version: "latest"

      # Step 3: Run unit tests with code coverage metrics
      - name: Run Unit Tests
        run: make test-unit PYTHON_VERSION=${{ matrix.python-version }}

      # Step 4: Upload HTML coverage folder and test results report to GitHub Artifacts
      - name: Upload Test and Coverage Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            .var/htmlcov/
            .var/report.html
          retention-days: 14

      # Step 5: Leave a summary comment inside the Pull Request (Only for Python 3.12 within PRs)
      - name: Comment Coverage on PR
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          matrix.python-version == '3.12' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@09c28b6767e12a048e0b23e821ed03133ee48a1a # v1.11.0
        with:
          pytest-xml-coverage-path: ./var/coverage.xml
          title: "\U0001F4CA Code Coverage Report"

  # Job 5: Perform static security analysis for vulnerabilities and leaked secrets
  security-scan:
    needs: [ test, changes ]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    # Step 1: Fetch the repository source code
    - name: Checkout code
      uses: actions/checkout@v7

    # Step 2: Run Trivy via official GitHub Action using env overrides
    - name: Run Trivy vulnerability scanner
      if: needs.changes.outputs.scan == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
        trivy-config: 'trivy.yml'

    # Step 3: Create empty SARIF report
    - name: Create empty SARIF placeholder if skipped
      if: needs.changes.outputs.scan != 'true'
      run: |
        # shellcheck disable=SC2016
        echo '{"version": "2.1.0", "$schema":  "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json", "runs": [{"tool": {"driver": {"fullName": "Trivy Vulnerability Scanner", "informationUri": "https://github.com/aquasecurity/trivy", "name": "Trivy", "rules": [], "version": "0.74.0"}}, "results": []}]}' > trivy-results.sarif

    # Step 4: Upload the SARIF file directly to GitHub Security & Quality tab
    - name: Upload Trivy scan results to GitHub Security
      if: |
        (success() || failure()) &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
        category: trivy-scanner

  # Job 6: Build python package
  build-check:
    needs: [ security-scan ]
    if: always() && needs.security-scan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    # Step 1: Fetch the repository source code
    - name: Checkout code
      uses: actions/checkout@v7

    # Step 2: Setup uv
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true

    # Step 3: Execute the build workflow to ensure distributions can be built and Twine checks pass
    - name: Test Build Artifacts
      run: make build PYTHON_VERSION=3.12

    # Step 4: Generate SBOM
    - name: Generate SBOM (SPDX format)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        format: spdx-json
        output-file: '.var/dist/sbom.spdx.json'

    # Step 5: Upload package artifacts
    - name: Upload built packages
      uses: actions/upload-artifact@v7
      with:
        name: python-packages
        path: .var/dist/
        if-no-files-found: error

  # Job 7: Build GitHub release
  publish-github-release:
    needs: [ build-check ]
    if: |
      always() &&
      needs.build-check.result == 'success' &&
      github.event_name == 'release' &&
      github.event.action == 'published'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # Step 1: Download package artifacts from the build job
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: .var/dist/

      # Step 2: Install Cosign CLI tool into the runner environment
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Step 3: Generate keyless cryptographic signatures for all release artifacts
      - name: Sign the publication artifacts
        run: |
          echo "Signing each artifact individually in .var/dist/ using GitHub OIDC identity..."
          for file in .var/dist/*; do
            if [ -f "$file" ]; then
              echo "Signing: $file"
              cosign sign-blob --yes \
                --output-signature "${file}.sig" \
                --output-certificate "${file}.pem" \
                "$file"
            fi
          done

      # Step 4: Verify ALL built files simultaneously inside GitHub Actions
      - name: Verify All Signed Artifacts inside CI
        run: |
          echo "Starting cryptographic verification for all build artifacts..."
          # Iterate through every file in the build distribution directory
          for file in .var/dist/*; do
            # Extract file extension
            ext="${file##*.}"

            # Skip signature and certificate files to prevent cosign from validating itself
            if [ "$ext" != "sig" ] && [ "$ext" != "pem" ]; then
              echo "----------------------------------------"
              echo "Verifying integrity and origin of: $file"

              cosign verify-blob \
                --signature "${file}.sig" \
                --certificate "${file}.pem" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
                "$file"
            fi
          done
          echo "----------------------------------------"
          echo "SUCCESS: All files successfully validated against GitHub OIDC context!"

      # Step 5: Simultaneously create a release on GitHub with auto-generated changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            .var/dist/*.whl
            .var/dist/*.tar.gz
            .var/dist/sbom.spdx.json
            .var/dist/*.sig
            .var/dist/*.pem
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true

  # Job 8: Build and upload python artifacts directly to TestPyPI using Trusted Publishing
  publish-testpypi:
    needs: [ publish-github-release ]
    if: |
      always() &&
      needs.publish-github-release.result == 'success' &&
      github.event_name == 'release' &&
      github.event.action == 'published'
    runs-on: ubuntu-latest

    environment: testpypi

    permissions:
      id-token: write

    steps:
      # Step 1: Download package artifacts from the build job
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: .var/dist/

      # Step 2: Publish to TestPyPI via OIDC token exchange (no passwords/tokens needed!)
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .var/dist
          repository-url: https://test.pypi.org/legacy/

  # Job 9: Build and upload python artifacts directly to PyPI using Trusted Publishing
  publish-pypi:
    needs: [ publish-testpypi ]
    if: |
      always() &&
      needs.publish-testpypi.result == 'success' &&
      github.event_name == 'release' &&
      github.event.action == 'published'
    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      id-token: write

    steps:
      # Step 1: Download package artifacts from the build job
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: .var/dist/

      # Step 2: Publish to PyPI via OIDC token exchange (no passwords/tokens needed!)
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .var/dist
