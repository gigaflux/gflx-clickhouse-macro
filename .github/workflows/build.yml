name: CI Pipeline

# Trigger the workflow on pushes to the main branch and any pull requests targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  # Job 1: Bump version while creating new release
  bump-version:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version to match GitHub Release Tag
        id: extract-version
        run: |
          TAG_VERSION="$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          uv run --group dev-release bumpver update --set-version "$TAG_VERSION" --no-commit --no-tag
          git add .
          git commit -m "bump: version update to $TAG_VERSION"
          git push origin main
          git push origin :refs/tags/${{ github.event.release.tag_name }}
          git push origin refs/tags/${{ github.event.release.tag_name }}

  # Job 2: Run code quality tools
  lint:
    needs: [ bump-version ]
    if: |
      github.event_name != 'release' ||
      needs.bump-version.result == 'success' ||
      needs.bump-version.result == 'skipped'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    # Step 1: Fetch the repository source code
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

    # Step 2: Install uv, since the Makefile relies on it for environment synchronization
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true # Enable automated caching of downloaded packages to speed up CI runs
        version: "latest"

    # Step 3: Execute linters, type-checkers, and spell-checkers via Ruff, Ty, Codespell and actionlint
    - name: Run Linters & Checkers
      run: make lint PYTHON_VERSION=3.12

    # Step 4: Execute Dependabot linter
    - name: Run Dependabot Linter
      uses: marocchino/validate-dependabot@d8ae5c0d03dd75fbd0ad5f8ab4ba8101ebbd4b37 # v3.0.0
      id: validate

    # Step 5: Execute Dependabot pull request comment
    - name: Run Dependabot pull request comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: always()
      with:
        header: validate-dependabot
        message: ${{ steps.validate.outputs.markdown }}

  # Job 3: Run test suites across multiple Python versions
  test:
    needs: [ lint ]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        # Test against all Python versions defined in pyproject.toml constraints
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      # Step 1: Fetch the repository source code
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      # Step 2: Install uv, since the Makefile relies on it for environment synchronization
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true # Enable automated caching of downloaded packages to speed up CI runs
          version: "latest"

      # Step 3: Run unit tests with code coverage metrics
      - name: Run Unit Tests
        run: make test-unit PYTHON_VERSION=${{ matrix.python-version }}

      # Step 4: Upload HTML coverage folder and test results report to GitHub Artifacts
      - name: Upload Test and Coverage Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            var/htmlcov/
            var/report.html
          retention-days: 14

      # Step 5: Leave a summary comment inside the Pull Request (Only for Python 3.12 within PRs)
      - name: Comment Coverage on PR
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          matrix.python-version == '3.12' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@09c28b6767e12a048e0b23e821ed03133ee48a1a # v1.11.0
        with:
          pytest-xml-coverage-path: ./var/coverage.xml
          title: "📊 Code Coverage Report"


  # Job 3: Perform static security analysis for vulnerabilities and leaked secrets
  security-scan:
    needs: [ test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    # Step 1: Fetch the repository source code
    - name: Checkout code
      uses: actions/checkout@v7
      with:
       ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

    # Step 2: Run Trivy via official GitHub Action using env overrides
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
        trivy-config: 'trivy.yml'

    # Step 3: Upload the SARIF file directly to GitHub Security & Quality tab
    - name: Upload Trivy scan results to GitHub Security
      if: |
        always() &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
        category: trivy-scanner

  # Job 4: Build python package
  build-check:
    needs: [ test, security-scan ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    # Step 1: Fetch the repository source code
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

    # Step 2: Setup uv
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true

    # Step 3: Execute the build workflow to ensure distributions can be built and Twine checks pass
    - name: Test Build Artifacts
      run: make build PYTHON_VERSION=3.12

    # Step 4: Generate SBOM
    - name: Generate SBOM (SPDX format)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        format: spdx-json
        output-file: '.var/dist/sbom.spdx.json'

    # Step 5: Upload package artifacts
    - name: Upload built packages
      uses: actions/upload-artifact@v7
      with:
        name: python-packages
        path: .var/dist/
        if-no-files-found: error

  # Job 5: Build and upload python artifacts directly to TestPyPI using Trusted Publishing
  publish-testpypi:
    needs: [ build-check ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    environment: testpypi

    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Download package artifacts from the build job
      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          name: python-packages
          path: .var/dist/

      # Step 2: Publish to TestPyPI via OIDC token exchange (no passwords/tokens needed!)
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .var/dist
          repository-url: https://test.pypi.org/legacy/

  # Job 6: Build and upload python artifacts directly to PyPI using Trusted Publishing
  publish-pypi:
    needs: [ publish-testpypi ] # Запустится ТОЛЬКО после успешной отправки на TestPyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      contents: write
      id-token: write

    steps:
      # Step 1: Download package artifacts from the build job
      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          name: python-packages
          path: .var/dist/

      # Step 2: Publish to PyPI via OIDC token exchange (no passwords/tokens needed!)
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .var/dist

      # Step 3: Install Cosign CLI tool into the runner environment
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Step 4: Generate keyless cryptographic signatures for all release artifacts
      - name: Sign the publication artifacts
        run: |
          echo "Signing artifacts in .var/dist/ using GitHub OIDC identity..."
          cosign sign-blob --yes \
            --output-signature .var/dist/package-artifacts.sig \
            --output-certificate .var/dist/package-artifacts.pem \
            .var/dist/*
        # --yes bypasses interactive confirmation prompts in non-interactive CI environments

      # Step 5: Verify ALL built files simultaneously inside GitHub Actions
      - name: Verify All Signed Artifacts inside CI
        run: |
          echo "Starting cryptographic verification for all build artifacts..."
          # Iterate through every file in the build distribution directory
          for file in .var/dist/*; do
            # Extract file extension
            ext="${file##*.}"

            # Skip signature and certificate files to prevent cosign from validating itself
            if [ "$ext" != "sig" ] && [ "$ext" != "pem" ]; then
              echo "----------------------------------------"
              echo "Verifying integrity and origin of: $file"

              cosign verify-blob \
                --signature .var/dist/package-artifacts.sig \
                --certificate .var/dist/package-artifacts.pem \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
                "$file"
            fi
          done
          echo "----------------------------------------"
          echo "SUCCESS: All files successfully validated against GitHub OIDC context!"

      # Step 6: Simultaneously create a release on GitHub with auto-generated changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            .var/dist/*.whl
            .var/dist/*.tar.gz
            .var/dist/sbom.spdx.json
            .var/dist/package-artifacts.sig
            .var/dist/package-artifacts.pem
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true
