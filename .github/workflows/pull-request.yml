name: Auto Labeler & Validator
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# Restrict permissions for security when handling PRs from external forks
permissions:
  contents: read
  pull-requests: write # Required to add labels and post PR updates
  issues: write        # Required for title validator action to post status checks/comments

jobs:
  pr-setup:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.actor, 'bot') }}
    steps:
      # Step 0. Lightweight Sparse Checkout (Downloads only 2 script files instantly)
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/scripts/auto-labeler.js
            .github/workflows/scripts/invalid-title-comment.js
          sparse-checkout-cone-mode: false

      # Step 1. AUTOMATICALLY PRE-FILL DESCRIPTION WITH COMMIT HISTORY (Runs only when PR is opened)
      # - name: Pre-fill PR Description with Commits
      #  uses: actions/github-script@v9
      #  with:
      #    script: |
      #      const script = require('./.github/workflows/scripts/pre-fill-description.js');
      #      await script({ github, context });

      # Step 2. Automatically manage labels and title based on PR template checkboxes
      - name: Auto-label PR based on Checkboxes
        if: ${{ !env.ACT }}
        uses: actions/github-script@v9
        with:
          script: |
            const script = require('./.github/workflows/scripts/auto-labeler.js');
            // Explicitly pass 'core' context so the script can manage workflow failures safely
            await script({ github, context, core });

      # Step 3. PR Title Validator for real developers (does NOT create unconfigured labels)
      - name: Validate PR Title
        id: validate_title
        if: ${{ !env.ACT }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Permitted prefixes mapped to your labeler.yml and release.yml
          types: |
            sec
            feat
            fix
            revert
            perf
            docs
            ci
            test
            build
            style
            refactor
            chore
          requireScope: false

      # Step 4. Comment on PR if Title is Invalid
      - name: Comment on PR if Title is Invalid
        if: failure() && steps.validate_title.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const script = require('./.github/workflows/scripts/invalid-title-comment.js');
            // FIXED: Explicitly pass 'core' object to ensure error handling inside the script matches Step 2
            await script({ github, context, core });
