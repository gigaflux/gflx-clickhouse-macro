version: 1

formatters:
  clickhouse_formatter:
    format: '%(asctime)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console_handler:
    class: logging.StreamHandler
    level: INFO
    formatter: clickhouse_formatter
    stream: ext://sys.stdout

loggers:
  clickhouse_etl:
    level: INFO
    handlers: [console_handler]
    propagate: false
  sqlglot:
    level: ERROR

root:
  level: WARNING
  handlers: [console_handler]
